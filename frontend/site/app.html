<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My applications | Lanyard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='5' y='6' width='14' height='16' rx='3' fill='%23ffd84d' stroke='%2312152a' stroke-width='1.5'/%3E%3C/svg%3E">
<script src="js/theme.js"></script>
<script>try{if(localStorage.getItem("autointerns.questionnaire.done")!=="1")location.replace("questionnaire.html")}catch(e){}</script>
<link rel="stylesheet" href="css/base.css">
<style>
  main{padding:var(--p-space-7) 0 var(--p-space-9)}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--p-space-5);flex-wrap:wrap;margin-bottom:var(--p-space-6)}
  .top h1{font-size:var(--p-step-3);margin:0}
  .figures{display:flex;gap:var(--p-space-6);flex-wrap:wrap}
  .figures div{min-width:5rem}
  .figures b{display:block;font:800 2.4rem/1 var(--font-display)}
  .figures span{color:var(--text-muted);font-size:.9rem}

  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--p-space-6);align-items:start}
  h2.s{font-size:1.35rem;margin-bottom:var(--p-space-4);display:flex;align-items:baseline;gap:var(--p-space-3)}
  h2.s .tag{font-family:var(--font-body)}

  .queue{border-top:2px solid var(--border-strong)}
  .q{display:grid;grid-template-columns:auto 1fr auto;gap:var(--p-space-4);align-items:center;padding:var(--p-space-4) 4px;border-bottom:1.5px solid var(--border)}
  .q b{font-family:var(--font-display);font-size:1.05rem}
  .q .act{color:var(--text-muted);font-size:.92rem}
  .q .bar-d{width:6px;align-self:stretch;border-radius:3px;background:var(--hue)}
  .empty{padding:var(--p-space-6) 0;color:var(--text-muted)}

  .paste{display:flex;gap:var(--p-space-2);margin-bottom:var(--p-space-4)}
  .paste input{flex:1}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--p-space-4)}
  .m{display:grid;gap:6px;padding:var(--p-space-4);border:1.5px solid var(--border);border-radius:var(--p-radius-md);background:var(--surface);margin-bottom:10px;border-left:6px solid var(--hue)}
  .m .l1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .m b{font-family:var(--font-display);font-size:1.05rem}
  .m .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--text-muted);font-size:.88rem}
  .m .acts{display:flex;gap:8px;margin-top:6px}

  .pipeline{margin-top:var(--p-space-8)}
  .cols{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:var(--p-space-3);overflow-x:auto;padding-bottom:var(--p-space-3)}
  .col h3{font:600 .9rem var(--font-body);margin:0 0 var(--p-space-3);display:flex;justify-content:space-between;color:var(--text-muted);padding-bottom:8px;border-bottom:2px solid var(--border-strong)}
  .k{background:var(--surface);border:1.5px solid var(--border);border-top:4px solid var(--hue);border-radius:var(--p-radius-sm);padding:10px;margin-bottom:8px;font-size:.88rem}
  .k b{display:block;font-family:var(--font-display);font-size:.95rem;line-height:1.2}
  .meter{height:8px;border-radius:4px;background:var(--surface-sunk);overflow:hidden;margin:var(--p-space-2) 0}
  .meter i{display:block;height:100%;width:66%;background:var(--primary)}
  .side .panel{margin-bottom:var(--p-space-4)}
  @media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="wrap">
  <div class="top">
    <div>
      <h1 id="hello">Here's where things stand.</h1>
      <p class="muted" id="sub" style="margin:6px 0 0"></p>
    </div>
    <div class="figures" id="figures"></div>
  </div>

  <div class="grid">
    <div>
      <h2 class="s">Needs you <span class="tag due" id="needCount"></span></h2>
      <div class="queue" id="queue"></div>

      <h2 class="s" style="margin-top:var(--p-space-8)">New matches</h2>
      <p class="small" id="pasteStatus" role="status" style="margin:0 0 8px"></p>
      <form class="paste" id="paste"><label class="sr" for="link">Posting link</label><input id="link" type="url" placeholder="Paste a link to any internship posting"><button class="btn" type="submit">Add posting</button></form>
      <div class="filters" id="filters" role="group" aria-label="Filter matches by field"></div>
      <div id="matches" aria-live="polite"></div>
    </div>

    <aside class="side">
      <div class="panel" id="usagePanel">
        <h3>This month</h3>
        <p class="muted small" style="margin-bottom:6px">Applications we handled on the Free plan</p>
        <div class="meter" role="img" id="meter" aria-label=""><i id="meterFill"></i></div>
        <p class="small" style="margin:0" id="usageText"></p>
        <p style="margin:var(--p-space-3) 0 0"><a class="btn sm" href="index.html#pricing">See plans</a></p>
      </div>
      <div class="panel">
        <h3>Your fields</h3>
        <div class="filters" id="myFields" style="margin-bottom:var(--p-space-3)"></div>
        <a href="onboarding.html" class="small">Change fields and preferences</a>
      </div>
      <div class="panel" id="headsUp" hidden>
        <h3>Heads up</h3>
        <p class="small muted" style="margin-bottom:8px" id="headsUpText"></p>
      </div>
    </aside>
  </div>

  <section class="pipeline" aria-labelledby="pl">
    <h2 class="s" id="pl">Everything you're tracking</h2>
    <div class="cols" id="cols"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const hue = cat => (LAN.byName[cat] || {}).hue || "slate";
  const WORKING = ["queued", "filling", "submitting"];
  const STAGES = [["found", "Saved"], ["awaiting", "Waiting on you"], ["submitted", "Submitted"], ["interview", "Interview"], ["offer", "Offer"], ["closed", "Closed"]];
  let apps = [], matches = [], profile = null, active = new Set(), poll = null;

  renderBar("app", "app").then(me => {
    if (!me) return;
    if (me.usage.limit == null) { $("usagePanel").hidden = true; return; }
    const used = Math.min(me.usage.used, me.usage.limit);
    $("meterFill").style.width = `${(used / me.usage.limit) * 100}%`;
    $("meter").setAttribute("aria-label", `${used} of ${me.usage.limit} used`);
    const next = new Date(); next.setMonth(next.getMonth() + 1, 1);
    $("usageText").textContent = `${used} of ${me.usage.limit} used. Resets ${next.toLocaleDateString(undefined, { month: "short", day: "numeric" })}.`;
  });

  async function load() {
    [apps, matches, profile] = await Promise.all([api("GET", "/applications"), api("GET", "/postings/matches"), profile || api("GET", "/profile")]);
    paint();
    clearTimeout(poll);
    if (apps.some(a => WORKING.includes(a.fill_state))) poll = setTimeout(load, 3000);
  }

  function nextStep(a) {
    if (a.fill_state === "queued" || a.fill_state === "filling") return ["We're filling out the application.", null];
    if (a.fill_state === "submitting") return ["We're submitting it now.", null];
    if (a.fill_state === "ready") return ["Ready for your OK. Review your answers and approve.", `<a class="btn sm" href="review.html?id=${a.id}">Review</a>`];
    if (a.fill_state === "needs_you") return [a.fill_note || "This one needs you to finish on the employer's site.", `<a class="btn sm" href="review.html?id=${a.id}">Open</a>`];
    if (a.fill_state === "failed") return [a.fill_note, `<button class="btn sm" data-prep="${a.id}" type="button">Try again</button>`];
    if (a.status === "interview") return ["Interview stage. Keep an eye on your email.", `<a class="btn sm secondary" href="${esc(a.link || "#")}" target="_blank" rel="noopener">Posting</a>`];
    if (a.status === "found") return ["Saved. We haven't started this one.", `<button class="btn sm" data-prep="${a.id}" type="button">Prepare application</button>`];
    return null;
  }

  function paint() {
    const first = (profile.name || "").split(" ")[0];
    $("hello").textContent = first ? `Hi ${first}, here's where things stand.` : "Here's where things stand.";
    const myFields = profile.fields || [];
    $("sub").textContent = myFields.length ? `Showing matches in ${myFields.length} ${myFields.length === 1 ? "field" : "fields"}.` : "You haven't picked fields yet, so every opening is shown.";
    $("myFields").innerHTML = myFields.length ? myFields.map(f => `<span class="chip sub" data-hue="${hue(f.name)}" aria-pressed="true" style="cursor:default">${esc(f.name)}</span>`).join("") : '<span class="muted small">None yet</span>';
    if (!profile.resumeName) { $("headsUp").hidden = false; $("headsUpText").innerHTML = 'Add your resume before we can prepare applications. <a href="onboarding.html">Add it now</a>.'; }

    const cnt = f => apps.filter(f).length;
    $("figures").innerHTML = `<div><b>${cnt(a => ["submitted", "interview", "offer"].includes(a.status))}</b><span>Applied</span></div><div><b>${cnt(a => a.status === "interview")}</b><span>Interviews</span></div><div><b>${cnt(a => ["ready", "needs_you"].includes(a.fill_state))}</b><span>Waiting on you</span></div>`;

    const open = apps.filter(a => !["rejected", "skipped", "submitted", "offer"].includes(a.status) || WORKING.includes(a.fill_state));
    const queue = open.map(a => [a, nextStep(a)]).filter(([, n]) => n).sort(([a], [b]) => (a.deadline_in ?? 999) - (b.deadline_in ?? 999));
    const waiting = queue.filter(([a]) => ["ready", "needs_you", "failed"].includes(a.fill_state)).length;
    $("needCount").textContent = waiting;
    $("needCount").hidden = !waiting;
    $("queue").innerHTML = queue.length ? queue.map(([a, [text, action]]) => `
      <div class="q" data-hue="${hue(a.category)}"><span class="bar-d"></span>
        <div><b>${esc(a.role)}</b> <span class="muted">at ${esc(a.company)}</span><div class="act">${esc(text)}</div></div>
        <div style="display:flex;gap:10px;align-items:center">${WORKING.includes(a.fill_state) ? '<span class="tag">Working on it</span>' : dueLabel(a.deadline_in)}${action || ""}</div></div>`).join("")
      : `<div class="empty">Nothing is waiting on you. Pick an opening below and we'll get started.</div>`;

    const fieldList = LAN.categories.filter(c => matches.some(m => m.category === c.name));
    $("filters").innerHTML = fieldList.map(c => chipButton(c, active.has(c.id))).join("");
    let list = matches;
    if (active.size) list = list.filter(m => active.has((LAN.byName[m.category] || {}).id));
    $("matches").innerHTML = list.length ? list.map(m => `
      <article class="m" data-hue="${hue(m.category)}"><div class="l1"><div><b>${esc(m.role)}</b><div class="muted small">${esc(m.company)}${m.location ? ", " + esc(m.location) : ""}</div></div>${dueLabel(m.deadline_in)}</div>
        <div class="meta">${m.category ? `<span class="tag">${esc(m.category)}</span>` : ""}<span class="tag">${m.opportunity_type === "co_op" ? "Co-op" : "Internship"}</span><span class="tag">${m.paid === "no" ? "Unpaid" : m.paid === "yes" ? "Paid" : "Pay not listed"}</span>${m.mode ? `<span class="tag">${esc(m.mode)}</span>` : ""}</div>
        <div class="acts"><button class="btn sm" data-new="${esc(m.id)}" type="button">Prepare application</button><button class="btn sm ghost" data-save="${esc(m.id)}" type="button">Save for later</button><button class="btn sm ghost" data-skip="${esc(m.id)}" type="button">Not interested</button></div></article>`).join("")
      : `<div class="empty">${matches.length ? "No openings with these filters. Remove a filter to see more." : "No new openings in your fields right now. Paste a link above to any posting you find, or add fields from \"Change fields and preferences.\""}</div>`;

    $("cols").innerHTML = STAGES.map(([k, label]) => {
      const items = apps.filter(a => (k === "closed" ? ["rejected", "skipped"].includes(a.status) : k === "found" ? ["found", "drafted"].includes(a.status) : a.status === k));
      return `<div class="col"><h3>${label}<span>${items.length}</span></h3>${items.map(a => `<a class="k" data-hue="${hue(a.category)}" href="review.html?id=${a.id}" style="text-decoration:none;color:inherit"><b>${esc(a.role)}</b><span class="muted">${esc(a.company)}</span></a>`).join("") || '<div class="muted small">Empty</div>'}</div>`;
    }).join("");
  }

  $("filters").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const id = b.dataset.id; active.has(id) ? active.delete(id) : active.add(id); paint(); });

  async function act(btn, fn) {
    btn.disabled = true;
    try { await fn(); await load(); } catch (e) { say($("pasteStatus"), e.message, "err"); btn.disabled = false; }
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-prep], [data-new], [data-save], [data-skip]");
    if (!b) return;
    if (b.dataset.prep) act(b, () => api("POST", `/applications/${b.dataset.prep}/prepare`));
    else if (b.dataset.new) act(b, async () => { const a = await api("POST", "/applications", { posting_id: b.dataset.new }); await api("POST", `/applications/${a.id}/prepare`); });
    else if (b.dataset.save) act(b, () => api("POST", "/applications", { posting_id: b.dataset.save }));
    else if (b.dataset.skip) act(b, async () => { const a = await api("POST", "/applications", { posting_id: b.dataset.skip }); await api("PATCH", `/applications/${a.id}`, { status: "skipped" }); });
  });

  $("paste").addEventListener("submit", async e => {
    e.preventDefault();
    const url = $("link").value.trim(); if (!url) return;
    say($("pasteStatus"), "Reading the posting...");
    try {
      await api("POST", "/postings/from-link", { url });
      $("link").value = "";
      say($("pasteStatus"), "Added. Choose \"Prepare application\" when you're ready.", "ok");
      await load();
    } catch (err) { say($("pasteStatus"), err.message, "err"); }
  });

  load();
</script>
</body>
</html>
